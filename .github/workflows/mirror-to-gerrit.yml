name: Mirror to Gerrit

on:
  push:
    branches:
      - dev-gerrit

jobs:
  mirror:
    runs-on: [self-hosted]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Gerrit remote and push
        shell: pwsh
        env:
            GERRIT_SSH: 'ssh://sihjiaqi@sgcn3sd3-git.rtkbf.com:29418/ameba-rtos-pro2-forked'
        run: |
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git remote add gerrit "$env:GERRIT_SSH"
            git push --force gerrit dev-gerrit